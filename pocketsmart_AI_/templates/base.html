<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        PocketSmart
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/styles.css"
    >

</head>


<body>

<header class="topbar">

    <a
        class="brand"
        href="/"
    >
        Pocket<span>Smart</span>
    </a>


    <nav>

        {% if user %}

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/home-planner">
                Home
            </a>

            <a href="/party-planner">
                Party
            </a>

            <a href="/jewelry-planner">
                Jewelry
            </a>

            <a href="/history">
                History
            </a>

            <form
                action="/logout"
                method="post"
                class="inline"
            >

                <button class="linkbtn">
                    Logout
                </button>

            </form>

        {% else %}

            <a href="/login">
                Login
            </a>

            <a
                class="nav-cta"
                href="/register"
            >
                Create Account
            </a>

        {% endif %}

    </nav>

</header>


<main>

    {% block content %}
    {% endblock %}

</main>


<footer>
    © 2026 PocketSmart.
    Smart budgeting and recommendations.
</footer>


<script src="/static/app.js"></script>

{% block scripts %}
{% endblock %}

</body>

</html>
